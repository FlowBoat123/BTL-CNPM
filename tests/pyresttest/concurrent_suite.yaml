- config:
    testset: Dental Clinic API - Realistic Concurrent Stability Suite
    timeout: 45
    concurrency: 48
    retry: 1
    backoff_initial: 0.25
    backoff_factor: 2
    backoff_max: 2
    warmup: 10

- test:
    name: api_services_read_x180
    method: GET
    url: /api/services
    expected_status:
      - 200
    iterations: 180
    validators:
      - compare:
          jsonpath_mini: status
          comparator: eq
          expected: success
      - compare:
          jsonpath_mini: count
          comparator: gt
          expected: 0

- test:
    name: webhook_fallback_contract_x120
    method: POST
    url: /webhook
    expected_status:
      - 200
    iterations: 120
    headers:
      Content-Type: application/json
    body: '{"session":"projects/demo/agent/sessions/concurrent-fallback","queryResult":{"intent":{"displayName":"unknown_intent"},"queryText":"xin chao","parameters":{}}}'
    validators:
      - compare:
          raw_body: ""
          comparator: contains
          expected: fulfillmentText

