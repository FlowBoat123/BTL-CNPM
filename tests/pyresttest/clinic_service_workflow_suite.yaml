- config:
    testset: Dental Clinic API - Clinic Service Workflow Suite
    timeout: 30
    concurrency: 1
    retry: 1
    backoff_initial: 0.25
    backoff_factor: 2

- test:
    name: 200_api_services_has_data
    method: GET
    url: /api/services
    expected_status:
      - 200
    validators:
      - compare:
          jsonpath_mini: status
          comparator: eq
          expected: success
      - compare:
          jsonpath_mini: count
          comparator: gt
          expected: 0

- test:
    name: 200_webhook_make_appointment_valid_future
    method: POST
    url: /webhook
    expected_status:
      - 200
    headers:
      Content-Type: application/json
    body: '{"session":"projects/demo/agent/sessions/test-clinic-workflow-session","queryResult":{"intent":{"displayName":"make_appointment"},"queryText":"toi muon dat lich nho rang luc 10 gio ngay 30 thang 12 nam 2099","parameters":{"date":"2099-12-30T10:00:00+07:00","hour":"2099-12-30T10:00:00+07:00","service":"Nho rang"}}}'

- test:
    name: 200_webhook_make_appointment_duplicate_slot_rejected
    method: POST
    url: /webhook
    expected_status:
      - 200
    headers:
      Content-Type: application/json
    body: '{"session":"projects/demo/agent/sessions/test-clinic-workflow-duplicate-slot","queryResult":{"intent":{"displayName":"make_appointment"},"queryText":"toi muon dat lich nho rang luc 10 gio ngay 30 thang 12 nam 2099","parameters":{"date":"2099-12-30T10:00:00+07:00","hour":"2099-12-30T10:00:00+07:00","service":"Nho rang"}}}'
    validators:
      - compare:
          raw_body: ""
          comparator: contains
          expected: fulfillmentText

