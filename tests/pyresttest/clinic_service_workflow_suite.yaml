- test:
    name: 200_assign_doctor_same_doctor_no_calendar_side_effect
    method: POST
    url: /assign-doctor
    expected_status:
      - 200
    headers:
      Content-Type: application/json
    body: '{"appointmentId":"test_e2e_assign_same_doctor","doctorId":"hC1kDpvF7It8suxOayV9"}'
    validators:
      - compare:
          jsonpath_mini: status
          comparator: eq
          expected: success

- test:
    name: 200_assign_doctor_unassigned_without_calendar_token
    method: POST
    url: /assign-doctor
    expected_status:
      - 200
    headers:
      Content-Type: application/json
    body: '{"appointmentId":"test_e2e_assign_unassigned","doctorId":"test_e2e_doctor_no_calendar"}'
    validators:
      - compare:
          jsonpath_mini: status
