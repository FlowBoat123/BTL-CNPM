- test:
    name: 200_complete_appointment_multiple_services_calculates_bill
    method: POST
    url: /api/doctor/complete-appointment
    expected_status:
      - 200
    headers:
      Content-Type: application/json
    body: '{"appointmentId":"test_e2e_complete_multi_service","doctorId":"hC1kDpvF7It8suxOayV9","services":[{"id":"1","quantity":1},{"id":"10","quantity":2}]}'
    validators:
      - compare:
          jsonpath_mini: status
          comparator: eq
          expected: success
