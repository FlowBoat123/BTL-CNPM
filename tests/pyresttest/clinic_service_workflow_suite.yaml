- test:
    name: 400_sync_calendar_doctor_without_google_token
    method: POST
    url: /api/doctor/sync-calendar
    expected_status:
      - 400
    headers:
      Content-Type: application/json
    body: '{"doctorId":"test_e2e_doctor_no_calendar"}'
    validators:
      - compare:
          jsonpath_mini: status
          comparator: eq
          expected: error

- test:
    name: 403_complete_appointment_wrong_doctor
    method: POST
    url: /api/doctor/complete-appointment
    expected_status:
      - 403
    headers:
      Content-Type: application/json
    body: '{"appointmentId":"test_e2e_complete_appointment","doctorId":"test_e2e_doctor_no_calendar","services":[{"id":"1","quantity":1}]}'
    validators:
      - compare:
          jsonpath_mini: status
          comparator: eq
          expected: error

- test:
