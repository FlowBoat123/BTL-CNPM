- config:
    testset: Dental Clinic API - Native PyRestTest Benchmark Suite
    timeout: 45

- benchmark:
    name: api_services_read_benchmark_x180
    method: GET
    url: /api/services
    warmup_runs: 10
    benchmark_runs: 180
    metrics:
      - total_time: mean
      - total_time: median
      - total_time: std_deviation
      - starttransfer_time: mean

- benchmark:
    name: webhook_fallback_contract_benchmark_x120
    method: POST
    url: /webhook
    warmup_runs: 10
    benchmark_runs: 120
    headers:
      Content-Type: application/json
    body: '{"session":"projects/demo/agent/sessions/benchmark-fallback","queryResult":{"intent":{"displayName":"unknown_intent"},"queryText":"xin chao","parameters":{}}}'
    metrics:
      - total_time: mean
      - total_time: median
      - total_time: std_deviation
      - starttransfer_time: mean

