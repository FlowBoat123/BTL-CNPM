    body: '{"session":"projects/demo/agent/sessions/api-contract-1","queryResult":{"intent":{"displayName":"unknown_intent"},"queryText":"xin chao","parameters":{}}}'
    validators:
      - compare:
          raw_body: ""
          comparator: contains
          expected: fulfillmentText

