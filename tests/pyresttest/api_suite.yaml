- test:
    name: 22_doctor_login_extract_identity
    method: POST
    url: /api/doctor/login
    expected_status:
      - 200
    headers:
      Content-Type: application/json
    body:
      template: '{"email":"$doctor_email","password":"$doctor_password"}'
    validators:
      - compare:
          jsonpath_mini: status
          comparator: eq
          expected: success
      - compare:
          jsonpath_mini: doctor.email
          comparator: str_eq
          expected:
            template: $doctor_email
      - extract_test:
          jsonpath_mini: doctorId
          test: exists
      - extract_test:
          jsonpath_mini: doctor.name
          test: exists
    extract_binds:
      - doctor_id:
          jsonpath_mini: doctorId
      - login_email:
          jsonpath_mini: doctor.email
      - login_name:
          jsonpath_mini: doctor.name

- test:
    name: 23_doctor_profile_uses_extracted_doctor_id
    method: GET
    url:
      template: /api/doctor/profile/$doctor_id
    expected_status:
      - 200
    validators:
      - compare:
          jsonpath_mini: status
          comparator: eq
          expected: success
      - compare:
          jsonpath_mini: doctor.id
          comparator: str_eq
          expected:
            template: $doctor_id
      - compare:
          jsonpath_mini: doctor.email
          comparator: str_eq
          expected:
            template: $login_email
      - compare:
          jsonpath_mini: doctor.name
          comparator: str_eq
          expected:
            template: $login_name
