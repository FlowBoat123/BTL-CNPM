- test:
    name: external_google_oauth_redirect_302
    method: GET
    url: /auth/google?doctorId=hC1kDpvF7It8suxOayV9
    follow_redirects: false
    expected_status:
      - 302
    validators:
      - compare:
          header: Location
          comparator: contains
          expected: accounts.google.com
