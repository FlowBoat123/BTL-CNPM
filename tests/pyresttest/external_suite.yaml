- config:
    testset: Dental Clinic API - External Dependencies Suite
    timeout: 45
    concurrency: 1
    retry: 2
    backoff_initial: 1
    backoff_factor: 2
    backoff_max: 8

- test:
    name: external_openweather_ask_weather_200
    method: POST
    url: /webhook
    expected_status:
      - 200
    headers:
      Content-Type: application/json
    body: '{"session":"projects/demo/agent/sessions/external-weather","queryResult":{"intent":{"displayName":"ask_weather"},"queryText":"thoi tiet Ha Noi hom nay","parameters":{"locate":"Hanoi"}}}'
    validators:
      - compare:
          raw_body: ""
          comparator: contains
          expected: fulfillmentText

- test:
    name: external_deepseek_dental_info_200
    method: POST
    url: /webhook
    expected_status:
      - 200
    headers:
      Content-Type: application/json
    body: '{"session":"projects/demo/agent/sessions/external-deepseek-dental","queryResult":{"intent":{"displayName":"dental_info"},"queryText":"Sau khi nho rang can luu y gi","parameters":{}}}'
    validators:
      - compare:
          raw_body: ""
          comparator: contains
